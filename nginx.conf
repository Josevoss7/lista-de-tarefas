server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Verificação de saúde usada pelos smoke tests do pipeline de CD
    location = /health {
        default_type application/json;
        return 200 '{"status":"ok"}';
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
