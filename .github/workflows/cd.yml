# Pipeline de Entrega/Implantação Contínua (CD) — PGCS seção 6
# Disparado a cada merge/push na main: CI -> Homologação -> Produção -> Release
name: CD

on:
  push:
    branches: [main]

concurrency:
  group: cd-main
  cancel-in-progress: false

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  homologacao:
    name: Deploy em Homologação + smoke tests
    needs: ci
    runs-on: ubuntu-latest
    environment: homologacao
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Definir nome da imagem (minúsculo)
        run: echo "IMAGEM=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Build da imagem
        run: docker build -t "$IMAGEM:${GITHUB_SHA::7}" -t "$IMAGEM:homologacao" .

      - name: Subir ambiente de homologação (container)
        run: docker run -d --name homologacao -p 8080:80 "$IMAGEM:${GITHUB_SHA::7}"

      - name: Smoke tests (saúde + página principal)
        run: |
          for i in $(seq 1 10); do curl -sf http://localhost:8080/health && break; sleep 1; done
          curl -sf http://localhost:8080/health | grep -q '"ok"'
          curl -sf http://localhost:8080/ | grep -q 'Lista de Tarefas'
          curl -sf http://localhost:8080/tarefas.js | grep -q 'adicionarTarefa'
          echo "Homologação OK"

      - name: Login no GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publicar imagem versionada (sha) no registro
        run: |
          docker push "$IMAGEM:${GITHUB_SHA::7}"
          docker push "$IMAGEM:homologacao"

  producao:
    name: Deploy em Produção (GitHub Pages)
    needs: homologacao
    runs-on: ubuntu-latest
    # Gate de release: configure "Required reviewers" neste environment no GitHub
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v3
        with:
          path: src
      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@v4
      - name: Smoke test em produção
        run: |
          sleep 10
          curl -sfL "${{ steps.deploy.outputs.page_url }}" | grep -q 'Lista de Tarefas'
          echo "Produção OK"

  release:
    name: Baseline (tag SemVer + release notes)
    needs: producao
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Gerar versão, tag e notas de release (semantic-release)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release

      - name: Marcar a imagem com a versão lançada
        run: |
          git fetch --tags
          VERSAO=$(git tag --points-at HEAD | grep '^v' | head -n1)
          if [ -z "$VERSAO" ]; then echo "Nenhuma nova versão (commits sem feat/fix)."; exit 0; fi
          IMAGEM="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker pull "$IMAGEM:${GITHUB_SHA::7}"
          docker tag "$IMAGEM:${GITHUB_SHA::7}" "$IMAGEM:${VERSAO#v}"
          docker tag "$IMAGEM:${GITHUB_SHA::7}" "$IMAGEM:latest"
          docker push "$IMAGEM:${VERSAO#v}"
          docker push "$IMAGEM:latest"
          echo "### Baseline $VERSAO gerada" >> "$GITHUB_STEP_SUMMARY"
