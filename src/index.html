<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lista de Tarefas</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="card">
    <h1>📝 Lista de Tarefas</h1>

    <form id="form-tarefa">
      <input id="titulo" type="text" placeholder="O que você precisa fazer?" autocomplete="off" />
      <button type="submit">Adicionar</button>
    </form>
    <p id="erro" class="erro" role="alert"></p>

    <div class="filtros">
      <button data-filtro="todas" class="ativo">Todas</button>
      <button data-filtro="pendentes">Pendentes</button>
      <button data-filtro="concluidas">Concluídas</button>
    </div>

    <ul id="lista"></ul>

    <footer>
      <span id="contador"></span>
      <button id="limpar" class="link">Limpar concluídas</button>
    </footer>
  </main>

  <script src="tarefas.js"></script>
  <script src="app.js"></script>
</body>
</html>
